<!-- نشانِ والیا (Whalya)، استودیوی سازندهٔ والیون. از هنرِ اصلیِ برند که مالک داد برداشته شده: رنگِ سِرولینِ #438CBF روی پلیتِ سرمه‌ای کِی شد و مرزِ سه جسمِ شکل با دنبال‌کردنِ مرز و ساده‌سازی به مسیر تبدیل شد (IoU با هنرِ اصلی ۰٫۹۹۸). تک‌رنگ و currentColor است تا در پاورقیِ سرمه‌ای و در چاپ هر دو درست بیاید. -->
